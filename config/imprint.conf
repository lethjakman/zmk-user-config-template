CONFIG_ZMK_RGB_UNDERGLOW=y

# Key chatter. ZMK debounces both edges for 5 ms by default, which is not
# enough once a switch's contacts start bouncing: the debouncer sees the
# bounce settle, calls it a release, then sees contact again and reports a
# second press. Raising the release time is what suppresses the duplicate;
# the press time is raised a little for noise on the way down.
#
# Times are in milliseconds and apply to both halves. Tuning: if fast
# repeats of the same key start getting dropped, lower RELEASE first; if
# chatter persists, raise it (20-25 is still comfortable). Max 16383.
#
# Note that debouncing masks the symptom, not the cause. ZMK's docs call out
# hot-swap sockets making poor contact as a common culprit -- worth reseating
# or bending the socket contacts back together on whichever key chatters.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15
